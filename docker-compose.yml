services:  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker123
      POSTGRES_DB: tracker_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: tracker
      DATABASE_PASSWORD: tracker123
      RAILS_ENV: development

volumes:
  postgres_data: